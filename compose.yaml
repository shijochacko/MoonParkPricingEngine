name: moonpark-pricing

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: moonpark_dev
      POSTGRES_USER: moonpark
      POSTGRES_PASSWORD: moonpark
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonpark -d moonpark_dev"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  app:
    image: moonpark-pricing:local
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/moonpark_dev
      DB_USERNAME: moonpark
      DB_PASSWORD: moonpark
      RATELIMIT_STORE: local
      PORT: "8080"
    ports:
      - "127.0.0.1:${MOONPARK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
